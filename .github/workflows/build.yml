name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Read-only. This job checks out, builds and throws the result away - it pushes
# nothing, comments on nothing and cuts no release. Stated rather than left to the
# repository default, which grants the job token write access to contents on a repo
# that has not been switched over, and hands every third-party action in the steps
# below the ability to commit to this repo. release.yml asks for contents:write
# separately, at the one job that needs it.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace has zero conda dependencies (pixi is
      # a task runner only; CMake and MSVC come from the runner image).
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Build and package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build -> package); the
      # workflow owns none, so local and CI can't drift. Packaging is offline: it
      # consumes the DLL the build just produced plus the scripts in this repo and
      # the checked-out submodule, so no GitHub token is needed.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run verify-package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run verify-package' failed"
            exit 1
          }

      # Nothing is uploaded from here. Pre-release builds come from the rolling
      # `dev` pre-release (pixi run release nightly), finished ones from a
      # versioned Release.
      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run verify-package'"
            exit 1
          }
          Write-Host "  $($installer.Name) ($([math]::Round($installer.Length / 1KB, 2)) KB)"
