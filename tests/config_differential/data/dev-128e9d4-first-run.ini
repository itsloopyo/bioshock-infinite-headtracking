;  BioShock Infinite - Head Tracking configuration
;  Lives next to BioShockInfinite.exe in Binaries/Win32/.

[General]
EnableOnStartup=1
Port=4242
DataFreshnessMs=500
;  Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1
;  Move the stock crosshair to follow the weapon's aim while your head turns.
;  No extra reticle is drawn. False leaves the stock position unchanged.
ShowAimMarker=1
;  What head tracking does while the sights are up. Cycled in game with
;  Insert (or Ctrl+Shift+U), which writes the new value back here.
;    paused   the game keeps the camera for as long as the sights are up
;    marker   tracking carries on with stock crosshair position correction
;    tracked  tracking carries on with the stock crosshair position unchanged
AdsMode=paused

[View]
;  Field of view in degrees, or 0 to render the game's own. Valid
;  values are 30 to 150. The game's own Field of View slider is an
;  offset its config file caps at 15 percent of the angle already
;  being rendered, so anything wider than that comes from here.
;  It is applied as a ratio against the angle the camera renders at
;  when nothing is zooming, so an unzoomed frame is drawn at exactly
;  this number and iron sights, scopes and scripted cameras still zoom
;  by the same factor they always did. Only the rendered frame is
;  widened: shots, traces and aim assist keep the game's own angle.
;  HeadTracking.log names the angles each frame was projected with.
Fov=0

[Smoothing]
;  Smoothing 0.0 (responsive) - 1.0 (heavy). Covers rotation and position.
;  The value is picked per connection from the packet source address:
;  LocalSmoothing for a tracker running on this PC (loopback),
;  RemoteSmoothing for a phone or other device on the network.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
;  6DOF positional tracking. The pose is used at 1:1 - shape it in your tracker,
;  not here. The limits below are metres of head travel, not a sensitivity.
Enabled=1
LimitX=0.3
;  Vertical travel is clamped to [-LimitYDown, +LimitY]: how far the view
;  may rise and how far it may drop, as separate metre budgets.
LimitY=0.2
LimitYDown=0.2
LimitZ=0.4
LimitZBack=0.1

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle), Page Up (cycle tracking mode), Page Down (yaw mode), Insert (cycle ADS mode).
Toggle=0x23
CycleMode=0x21
YawMode=0x22
AdsMode=0x2D
;  Chord alternatives: Ctrl+Shift+Y (toggle), Ctrl+Shift+G (cycle tracking mode), Ctrl+Shift+H (yaw mode), Ctrl+Shift+U (cycle ADS mode).
ChordToggle=1
ChordCycleMode=1
ChordYawMode=1
ChordAdsMode=1

[Diagnostics]
;  Dump the player controller to HeadTracking.log every two seconds, as
;  rows of hex dwords. A maintenance diagnostic: it writes several
;  kilobytes a second and will bury everything else in the log. Leave it
;  false unless you are diffing the dumps to find where a new game build
;  moved a field.
StateProbe=0

;  Sample the head pose, the aim resolved in the tracked view and the
;  screen position it projected to, once every two seconds. Turn it on
;  when the aim marker sits in the wrong place and you are reporting it;
;  a session of it is thousands of lines, and the startup, tracking and
;  crosshair lines you would otherwise be reading sit between them.
AimGeometry=0
